<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nexora Auth</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar glass">
    <div class="brand">
      <div class="brand-mark">N</div>
      <div>
        <h1>Nexora</h1>
        <p>تجربة تسجيل دخول حديثة وآمنة</p>
      </div>
    </div>

    <button id="themeBtn" class="theme-btn" aria-label="تبديل الوضع">
      <span class="theme-light">☀️</span>
      <span class="theme-dark">🌙</span>
    </button>
  </header>

  <main class="page">
    <section class="auth-card glass">
      <div class="chip">تطبيق جديد بالكامل</div>
      <h2>أهلاً بك 👋</h2>
      <p class="subtitle">سجّل دخولك باستخدام Google أو Facebook في واجهة زجاجية مودرن.</p>

      <div id="statusBox" class="status">جارِ التحقق من الجلسة...</div>

      <div id="guestActions" class="actions">
        <button class="social-btn google" id="googleBtn">
          <span>G</span>
          متابعة باستخدام Google
        </button>
        <button class="social-btn facebook" id="facebookBtn">
          <span>f</span>
          متابعة باستخدام Facebook
        </button>
      </div>

      <div id="userBox" class="user-box hidden">
        <p>تم تسجيل الدخول بنجاح ✅</p>
        <h3 id="userEmail"></h3>
        <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
